<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7B68EE;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Council building pillars -->
  <rect x="15" y="60" width="10" height="35" fill="url(#grad1)" rx="2"/>
  <rect x="32" y="55" width="10" height="40" fill="url(#grad1)" rx="2"/>
  <rect x="49" y="50" width="10" height="45" fill="url(#grad1)" rx="2"/>
  <rect x="66" y="55" width="10" height="40" fill="url(#grad1)" rx="2"/>
  <rect x="83" y="60" width="10" height="35" fill="url(#grad1)" rx="2"/>
  
  <!-- Base -->
  <rect x="10" y="95" width="88" height="5" fill="#4A90E2" rx="2"/>
  
  <!-- Roof -->
  <polygon points="50,10 5,45 95,45" fill="url(#grad1)"/>
  
  <!-- AI Symbols on pillars -->
  <circle cx="20" cy="75" r="3" fill="white" opacity="0.8"/>
  <circle cx="37" cy="72" r="3" fill="white" opacity="0.8"/>
  <circle cx="54" cy="68" r="3" fill="white" opacity="0.8"/>
  <circle cx="71" cy="72" r="3" fill="white" opacity="0.8"/>
  <circle cx="88" cy="75" r="3" fill="white" opacity="0.8"/>
